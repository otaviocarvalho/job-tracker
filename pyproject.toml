[tool.poetry]
name = "job-tracker"
version = "0.2.0"
description = "Job board scraper CLI with profile scoring, SQLite dedup, and a markdown digest delivered by a Hermes cron."
authors = ["Otavio Carvalho <otavio@users.noreply.github.com>"]
packages = [{ include = "jobtracker", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
