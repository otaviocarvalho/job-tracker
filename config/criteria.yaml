# Hard reject: if ALL of these are absent from title, likely not a fit
# (at least one positive keyword must be present)
require_any_title_keyword:
  - engineer
  - developer
  - software
  - backend
  - back-end
  - platform
  - infrastructure
  - lead
  - staff
  - principal
  - senior

# Soft scoring: positive keywords in title or description
