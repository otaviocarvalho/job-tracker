# Search groups (AD-0008): parallel trackers over the same feeds.
#
# Each group = one dedup space + one digest block per run. The Hermes cron
# runs one group per job (`main.py --group <name>`), so each lands as its own
# Telegram digest.
#
# Keys:
#   name:                      group id, used by `--group <name>` and the dedup store
#   label:                     display label in the digest block
#   require_location_keywords: word-boundary gate on the `location` field only;
#                              a listing with no location is dropped for the group
#                              (it cannot prove geography). Empty/absent = pass all.
#   sources:                   optional subset of source names; absent = all sources
#   trending_manual:           render the TRENDING MANUAL CHECK block (default false)
#
# Adding a group is YAML-only: append an entry, wire a cron, done (no code).
groups:
  - name: global
    label: Global
    trending_manual: true

