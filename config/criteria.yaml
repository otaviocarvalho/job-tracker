# Profile Fit Criteria for Job Matching
# Used by filters/matcher.py to score listings

# Hard reject: if ANY of these terms appear in title, auto-reject
reject_title_keywords:
  - frontend
  - front-end
  - front end
  - react native
  - mobile developer
  - ios developer
  - android developer
  - ui developer
  - ux developer
  - engineering manager
  - head of engineering
  - vp of engineering
  - cto
  - director of engineering
  - devops engineer
  - sre
  - site reliability
  - security engineer
  - sales
  - marketing
  - product manager
  - project manager
  - designer
  - data scientist
  - data analyst
  - architect
  - solutions engineer
  - solution engineer

